// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Keep CMake output outside pnpm's deeply nested dependency directories on Windows.
subprojects { subproject ->
  ['com.android.application', 'com.android.library'].each { pluginId ->
    subproject.pluginManager.withPlugin(pluginId) {
      subproject.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
        androidDsl.externalNativeBuild.cmake.buildStagingDirectory =
          rootProject.file(".cxx/${subproject.name}")
      }
    }
  }
}
